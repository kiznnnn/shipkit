# Keeps the sales page in step with Gumroad: the price ladder, the "left" counters and the founders wall.
# Needs one repo secret, GUMROAD_ACCESS_TOKEN (Gumroad › Settings › Advanced › Applications).
name: Sync founders from Gumroad
on:
  schedule:
    - cron: "*/15 * * * *"
  workflow_dispatch:
  push:
    branches: [main]
    paths: [docs/index.html]
permissions:
  contents: write
concurrency:
  group: founders
  cancel-in-progress: false
jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Read sales and update the page
        env:
          GUMROAD_ACCESS_TOKEN: ${{ secrets.GUMROAD_ACCESS_TOKEN }}
          GUMROAD_PRODUCT_ID: glQfj7iEHBMWcFBTSYmy0g==
        run: |
          if [ -z "$GUMROAD_ACCESS_TOKEN" ]; then echo "::warning::Add the GUMROAD_ACCESS_TOKEN secret to turn on the sync."; exit 0; fi
          node scripts/sync-founders.mjs docs/index.html
      - name: Commit if anything changed
        run: |
          if git diff --quiet docs/index.html; then echo "no change"; exit 0; fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "Update sales counter and founders wall" docs/index.html
          git push
