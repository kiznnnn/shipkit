<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="robots" content="noindex">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Your Launch Teardown</title>
<meta name="description" content="Your Launch Teardown from Ship Kit.">
<link rel="canonical" href="https://shipkit.tech/t">
<meta property="og:type" content="website">
<meta property="og:url" content="https://shipkit.tech/t">
<meta property="og:title" content="Your Launch Teardown">
<meta property="og:description" content="Your Launch Teardown from Ship Kit.">
<meta property="og:image" content="https://shipkit.tech/og-check.png?v=2">

<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Geist:wght@400;500;600&family=Geist+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#fbfbfd; --surface:#ffffff; --sunk:#f3f4f8;
  --ink:#0a0b1a; --ink2:#3c4058; --muted:#6b7089; --line:#e7e8ef; --line2:#d9dbe6;
  --blue:#2f3cff; --lime:#d8ff3d;
  --red:#d92d4b; --amber:#b86e00; --green:#17803d;
  --sans:"Geist",ui-sans-serif,system-ui,-apple-system,sans-serif;
  --mono:"Geist Mono",ui-monospace,SFMono-Regular,Menlo,monospace;
  --ease:cubic-bezier(.16,1,.3,1); --spring:cubic-bezier(.34,1.56,.64,1);
  --shadow:0 1px 2px rgba(10,11,26,.04),0 8px 24px -8px rgba(10,11,26,.10);
}
*{box-sizing:border-box;margin:0}
[hidden]{display:none!important}
body{background:var(--bg);color:var(--ink);font:16px/1.6 var(--sans);-webkit-font-smoothing:antialiased}
a{color:inherit;text-decoration:none}
button,input{font:inherit;color:inherit}
.wrap{max-width:860px;margin:0 auto;padding:0 24px}
.nav .wrap{max-width:1200px;display:flex;align-items:center;justify-content:space-between;height:64px}
.brand{display:flex;align-items:center;gap:10px;font-weight:600;letter-spacing:-.01em}
.brand svg{width:26px;height:26px}
.navlinks{display:flex;gap:24px;font-size:14px;color:var(--ink2);align-items:center}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;height:44px;padding:0 18px;border-radius:12px;font-weight:500;font-size:15px;border:0;cursor:pointer;white-space:nowrap;transition:background .2s,transform .25s var(--spring)}
.btn:active{transform:scale(.97)}
.btn-sm{height:36px;padding:0 14px;border-radius:10px;font-size:14px}
.btn-ink{background:var(--ink);color:#fff}.btn-ink:hover{background:#1d2036}
.btn-lime{background:var(--lime);color:var(--ink);box-shadow:inset 0 -1px 0 rgba(0,0,0,.12)}.btn-lime:hover{background:#e3ff6b}
.btn-line{border:1px solid var(--line2);background:var(--surface)}
.hero{padding:72px 0 28px;text-align:center}
.eyebrow{display:inline-flex;gap:8px;align-items:center;font:500 13px var(--mono);color:var(--blue);background:#eef0ff;border-radius:999px;padding:5px 12px}
h1{font-weight:500;font-size:clamp(40px,6vw,68px);line-height:1;letter-spacing:-.045em;margin:22px auto 16px;max-width:14ch;text-wrap:balance}
.lede{color:var(--ink2);font-size:18px;max-width:34em;margin:0 auto}
form{display:flex;gap:8px;max-width:600px;margin:32px auto 0;background:var(--surface);border:1px solid var(--line2);border-radius:16px;padding:6px;box-shadow:var(--shadow)}
form:focus-within{border-color:var(--blue)}
input{flex:1;min-width:0;border:0;outline:0;background:none;padding:0 12px;font-size:16px}
.fine{font-size:13px;color:var(--muted);margin-top:12px}
.err{color:var(--red);font-size:14px;margin-top:14px}
.load{margin:40px auto 0;max-width:600px;font:14px var(--mono);color:var(--muted);text-align:left;background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:18px 20px}
.load div{opacity:0;animation:in .4s var(--ease) forwards}
@keyframes in{to{opacity:1}}
.result{padding:24px 0 40px}
.top{display:grid;grid-template-columns:200px 1fr;gap:20px;align-items:stretch}
.score{background:var(--ink);color:#fff;border-radius:20px;padding:22px;display:flex;flex-direction:column;justify-content:space-between}
.score b{font-size:64px;font-weight:500;letter-spacing:-.04em;line-height:1;font-variant-numeric:tabular-nums}
.score b small{font-size:20px;color:#8a8fae}
.score span{font-size:13px;color:#b9bdd8}
.score .verdict{color:var(--lime);font-weight:500;font-size:15px}
.card{background:var(--surface);border:1px solid var(--line);border-radius:20px;padding:18px;box-shadow:var(--shadow)}
.card h2{font:500 12px var(--mono);color:var(--muted);text-transform:uppercase;letter-spacing:.06em;margin-bottom:10px}
.preview{border:1px solid var(--line);border-radius:14px;overflow:hidden}
.preview .img{aspect-ratio:1200/630;background:var(--sunk) center/cover no-repeat;display:flex;align-items:center;justify-content:center;color:var(--muted);font-size:13px}
.preview p{padding:8px 12px;font-size:13px;color:var(--muted);border-top:1px solid var(--line)}
.preview p b{display:block;color:var(--ink);font-weight:500;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.list{margin-top:20px;display:flex;flex-direction:column;gap:8px}
.item{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:14px 16px;display:grid;grid-template-columns:auto 1fr;gap:4px 12px;opacity:0;transform:translateY(8px);animation:rise .5s var(--ease) forwards}
@keyframes rise{to{opacity:1;transform:none}}
.chip{grid-row:span 3;align-self:start;font:600 12px/1 var(--sans);border-radius:999px;padding:5px 0;width:66px;text-align:center;margin-top:1px}
.fail .chip{background:var(--red);color:#fff}.warn .chip{background:#f0a531;color:var(--ink)}.pass .chip{background:var(--lime);color:var(--ink)}
.item b{font-weight:500}
.item p{font-size:14px;color:var(--ink2)}
.item code{font:12.5px var(--mono);background:var(--sunk);border-radius:6px;padding:6px 8px;display:block;margin-top:6px;color:var(--ink);white-space:pre-wrap;word-break:break-word}
.pass p{color:var(--muted)}
.share{display:flex;gap:10px;flex-wrap:wrap;margin-top:22px}
.more{margin:48px 0 80px;background:var(--surface);border:1px solid var(--line);border-radius:20px;padding:28px;display:flex;gap:24px;align-items:center;justify-content:space-between;flex-wrap:wrap}
.more-cta{display:flex;gap:10px;flex-wrap:wrap}
.more h3{font-weight:500;font-size:22px;letter-spacing:-.02em}
.more p{color:var(--ink2);font-size:15px;max-width:36em}
.what{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin:48px 0 0}
.what div{border:1px solid var(--line);border-radius:14px;padding:14px;font-size:14px;color:var(--ink2);background:var(--surface)}
.what b{display:block;color:var(--ink);font-weight:500;margin-bottom:2px}
@media (max-width:640px){.top{grid-template-columns:1fr}.what{grid-template-columns:1fr}.hide-m{display:none}form{flex-direction:column}form .btn{width:100%}}
@media (prefers-reduced-motion:reduce){.item,.load div{animation:none;opacity:1;transform:none}}
.get{display:grid;grid-template-columns:repeat(2,1fr);gap:10px;margin:40px 0 0;text-align:left}
.get div{border:1px solid var(--line);border-radius:14px;padding:16px;font-size:15px;color:var(--ink2);background:var(--surface)}
.get b{display:block;color:var(--ink);font-weight:500;margin-bottom:4px}
.who{margin:40px 0 80px;color:var(--ink2);font-size:15px;text-align:center}
.who a{color:var(--blue)}
.box{max-width:600px;margin:40px auto 80px;background:var(--surface);border:1px solid var(--line);border-radius:20px;padding:28px;box-shadow:var(--shadow);text-align:left}
.box h2{font-weight:500;font-size:22px;letter-spacing:-.02em;margin-bottom:8px}
.box p{color:var(--ink2);margin-top:8px}
.box .link{display:block;font:14px var(--mono);background:var(--sunk);border-radius:10px;padding:12px;margin-top:14px;word-break:break-all;color:var(--ink)}
.td{max-width:720px;margin:24px auto 80px;background:var(--surface);border:1px solid var(--line);border-radius:20px;padding:32px;box-shadow:var(--shadow)}
.td h2{font-weight:500;font-size:24px;letter-spacing:-.02em;margin:28px 0 10px}.td h2:first-child{margin-top:0}
.td h3{font-weight:500;font-size:17px;margin:18px 0 6px}
.td p,.td li{color:var(--ink2);margin-top:6px}.td ul,.td ol{padding-left:20px}
.td pre{font:13.5px/1.55 var(--mono);background:var(--sunk);border-radius:12px;padding:14px;white-space:pre-wrap;margin-top:8px;color:var(--ink)}
@media (max-width:640px){.get{grid-template-columns:1fr}.td,.box{padding:20px}}
</style>
<script src="https://shipkit-stats.zionerkins.workers.dev/s.js" defer></script>
</head>
<body>
<header class="nav"><div class="wrap">
  <a class="brand" href="/"><svg viewBox="0 0 1024 1024" aria-hidden="true"><rect width="1024" height="1024" rx="230" fill="#2f3cff"/><g fill="#d8ff3d"><path d="M548 196C650 300 742 470 776 640H548Z"/><path d="M500 300C430 400 352 520 318 640H500Z"/><path d="M232 690H792C778 770 716 826 640 826H384C308 826 246 770 232 690Z"/></g></svg>Ship Kit</a>
  <nav class="navlinks" aria-label="Main"><a class="hide-m" href="/">Ship Kit</a><a href="https://github.com/kiznnnn/shipkit">GitHub</a></nav>
</div></header>
<main class="wrap">
  <section class="hero" style="padding-bottom:0">
    <span class="eyebrow">Launch Teardown</span>
    <h1 id="h" style="font-size:clamp(32px,5vw,52px)">Loading…</h1>
    <p class="lede" id="sub"></p>
  </section>
  <article class="td" id="td" hidden></article>
</main>
<footer style="max-width:1200px;margin:0 auto;padding:40px 24px 56px;font-size:14px;color:#3c4058;display:flex;flex-wrap:wrap;gap:8px 20px"><span>© 2026 Ship Kit</span><a href="/" style="color:inherit">Home</a><a href="/check" style="color:inherit">Free launch check</a><a href="/privacy" style="color:inherit">Privacy</a><a href="/terms" style="color:inherit">Terms</a><a href="https://x.com/ZionE8T" style="color:inherit">Contact: @ZionE8T</a></footer>
<script>
const API = 'https://shipkit-stats.zionerkins.workers.dev';
const $ = (s) => document.querySelector(s);
const id = new URLSearchParams(location.search).get('id') || '';
fetch(API + '/td/' + encodeURIComponent(id)).then((r) => r.json()).then((d) => {
  if (d.error) { $('#h').textContent = 'Teardown not found'; $('#sub').innerHTML = 'Check the link from your thank-you page, or DM <a href="https://x.com/ZionE8T" style="color:var(--blue)">@ZionE8T</a>.'; return; }
  const site = String(d.site).replace(/[<>&"]/g, '');
  if (!d.ready) {
    const due = new Date((d.ts + 12 * 3600) * 1000);
    $('#h').textContent = 'Your teardown is being written';
    $('#sub').textContent = 'For ' + site + '. It will be here by ' + due.toLocaleString([], { weekday: 'short', hour: 'numeric', minute: '2-digit' }) + '. Come back to this page.';
    return;
  }
  $('#h').textContent = 'Teardown: ' + site;
  $('#sub').textContent = 'Fix them in order. The first one matters most.';
  $('#td').innerHTML = d.html; $('#td').hidden = false;
}).catch(() => { $('#h').textContent = 'Could not load the teardown'; $('#sub').textContent = 'Refresh in a moment.'; });
</script>
</body>
</html>
